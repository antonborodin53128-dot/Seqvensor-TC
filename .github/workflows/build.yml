name: build

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-latest
            arch: x64
          - name: arm64
            runner: windows-11-arm
            arch: ARM64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # No -G: CMake picks the newest Visual Studio installed on the runner.
      - name: Configure
        shell: bash
        run: |
          set +e
          cmake -S . -B build -A ${{ matrix.arch }} > configure.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=configure failed::$(tail -n 40 configure.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit $code
          fi
          tail -n 5 configure.log

      - name: Build
        shell: bash
        run: |
          set +e
          cmake --build build --config Release --parallel > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "::error title=build failed::$(grep -E 'error|fatal' build.log | head -n 25 | cut -c1-400 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit $code
          fi
          tail -n 5 build.log

      - name: Collect exe
        shell: bash
        run: |
          mkdir -p out
          cp build/TC_artefacts/Release/TC.exe out/TC-${{ matrix.name }}.exe
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TC-${{ matrix.name }}
          path: out/TC-${{ matrix.name }}.exe

      - name: Publish to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then tag=latest; else tag=preview; fi
          gh release view $tag >/dev/null 2>&1 || gh release create $tag --title "TC ($tag build)" --notes "Automatic builds. 'latest' = main, 'preview' = test branches." $( [ $tag = preview ] && echo --prerelease )
          gh release upload $tag out/TC-${{ matrix.name }}.exe --clobber
